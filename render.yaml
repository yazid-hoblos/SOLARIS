services:
  - type: web
    name: solaris-chatbot
    env: docker
    dockerfilePath: biomera/Dockerfile
    region: oregon
    plan: free
    branch: dev
    envVars:
      - key: PORT
        value: 5000
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: 1
    healthCheckPath: /health
